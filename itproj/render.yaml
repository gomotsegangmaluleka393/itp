# Render setup for the HMF server (website + API for the Android apps)
# Render reads this file when you choose New > Blueprint and pick this repo.
services:
  - type: web
    name: hmf                 # gives the address https://hmf.onrender.com (if the name is free)
    runtime: node
    plan: free
    region: frankfurt         # closest Render region to South Africa
    rootDir: itproj/hmf-auth  # path from the top of the GitHub repo
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSPITAL_TZ
        value: Africa/Johannesburg
      - key: SESSION_SECRET
        generateValue: true   # Render makes a random one
      # sync: false means Render asks you to paste the value (it stays out of GitHub)
      - key: DATABASE_URL     # Neon connection string
        sync: false
      - key: MONGODB_URI      # MongoDB Atlas connection string
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: CHATBOT_PROVIDER
        sync: false
      - key: CORTI_API_KEY
        sync: false
      - key: CORTI_BASE_URL
        sync: false
      - key: CORTI_MODEL
        sync: false
