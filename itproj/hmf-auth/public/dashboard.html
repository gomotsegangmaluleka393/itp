<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Hospital Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<!-- Home page for staff roles that don't have their own portal yet (nurse, pharmacist, etc.) -->
<body class="loading" data-portal="staff" data-page="dashboard" data-title="Home">
  <main class="page">
    <div class="page-head"><div><h1 id="greeting">Welcome</h1><p>You are logged in.</p></div></div>
    <div class="card" style="max-width:560px">
      <dl class="details">
        <dt>Role</dt><dd id="role"></dd>
        <dt>Email</dt><dd id="email"></dd>
      </dl>
      <p class="muted small" style="margin:16px 0 0">Pages for your role will appear in the sidebar as they are added.</p>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    App.ready.then((u) => {
      document.getElementById('greeting').textContent = `Welcome, ${u.name}`;
      document.getElementById('role').textContent = label(u.role);
      document.getElementById('email').textContent = u.email;
    });
  </script>
</body>
</html>
